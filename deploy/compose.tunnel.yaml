# Adds a Cloudflare Tunnel in front of compose.yaml, for a host without a reverse proxy or an
# open port. Turn it on with this line in .env, so update.sh and docker compose both pick it up:
#   COMPOSE_FILE=compose.yaml:compose.tunnel.yaml
#
# The tunnel is remotely managed. In the Cloudflare dashboard, route the public hostname to
# http://api:8080.
services:
  tunnel:
    image: ${CLOUDFLARED_IMAGE:?Set a cloudflared image with its @sha256 digest}
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set the tunnel token}
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
