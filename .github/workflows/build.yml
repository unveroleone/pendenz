name: Check and build

on:
  push:
    branches: [main]
    tags: ['v*']
    # The Mac release script commits the update feed alone. Path filters do not apply to tags.
    paths-ignore: ['apple/appcast.xml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Rust format and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Prettier
        run: |
          npm install --global pnpm@12.11.2
          pnpm install --frozen-lockfile
          pnpm exec prettier --check .
      - name: The tag matches the server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "pendenz") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in server/Cargo.toml." >&2; exit 1; }

  # Docker's reusable workflow builds each platform on a native runner (arm64 without QEMU),
  # merges them into one multi-platform image and signs its provenance. The labels from
  # metadata-action carry the commit and the repo URL, which update.sh checks.
  build:
    name: Build image
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      file: deploy/api.Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: pendenz-api
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}-api
      meta-tags: |
        type=sha,format=long,prefix=
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The pendenz command for agents' machines, attached to the release with install.sh. Built
  # on native runners. The Linux builds link glibc of Ubuntu 22.04, so they run on most systems
  # from that age on.
  binaries:
    name: Build the command for ${{ matrix.name }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked --bin pendenz
      - name: Pack
        run: |
          tar -czf "pendenz-${{ matrix.name }}.tar.gz" -C target/release pendenz
          ./target/release/pendenz --version
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pendenz-${{ matrix.name }}
          path: pendenz-${{ matrix.name }}.tar.gz
          retention-days: 7

  publish:
    name: Report and release
    needs: [build, binaries]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.binaries.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Report the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-api
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          {
            echo "### api"
            echo "\`$IMAGE@$DIGEST\`"
            echo "Deploy on the host with: \`update.sh $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository }}-api
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$version" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          notes=$(printf 'Image: `%s:%s` (linux/amd64, linux/arm64)\n\nUpdate a server with `update.sh %s`.' "$IMAGE" "$version" "$version")
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes" $prerelease
      - name: Check out the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/install.sh
          sparse-checkout-cone-mode: false
      - name: Fetch the builds of the command
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pendenz-*
          path: dist
          merge-multiple: true
      - name: Attach the command and its installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp deploy/install.sh dist/install.sh
          (cd dist && sha256sum pendenz-*.tar.gz > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/install.sh --clobber
