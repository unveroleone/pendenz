[package]
name = "pendenz"
version = "0.5.1"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
imagesize = "0.15"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rmcp = { version = "3.10", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
